name: Operator

on:
  push:
    branches:
      - main
    paths:
      - "operator/**"
      - "charts/openfga-operator/**"
      - ".github/workflows/operator.yml"
  pull_request:
    paths:
      - "operator/**"
      - "charts/openfga-operator/**"
      - ".github/workflows/operator.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the operator image to GHCR"
        type: boolean
        default: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openfga-operator

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a version bump when the operator image changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # CI publishes ghcr.io/openfga/openfga-operator:<appVersion> once and never
          # overwrites it, so a change to the image is only released when the
          # operator chart's appVersion and version are bumped.
          image_inputs=(operator/cmd operator/internal operator/go.mod operator/go.sum operator/Dockerfile)
          if git diff --quiet "origin/$BASE...HEAD" -- "${image_inputs[@]}"; then
            echo "operator image inputs unchanged"
            exit 0
          fi
          field() { grep "^$1:" "$2" | awk '{print $2}' | tr -d '"'; }
          if ! git show "origin/$BASE:charts/openfga-operator/Chart.yaml" > /tmp/base-chart.yaml 2>/dev/null; then
            echo "operator chart is new in this PR"
            exit 0
          fi
          for f in appVersion version; do
            if [[ "$(field $f /tmp/base-chart.yaml)" == "$(field $f charts/openfga-operator/Chart.yaml)" ]]; then
              echo "::error file=charts/openfga-operator/Chart.yaml::operator image inputs changed but $f is still $(field $f charts/openfga-operator/Chart.yaml); bump appVersion and version so the change is published"
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Run tests
        working-directory: operator
        run: go test ./... -race -v

      - name: Check formatting
        working-directory: operator
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        working-directory: operator
        run: go vet ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from Chart.yaml
        id: version
        run: |
          version=$(grep '^appVersion:' charts/openfga-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Operator version: ${version} (sha: ${short_sha})"

      - name: Determine push policy
        id: policy
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "mode=main" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{ inputs.push_image }}" == "true" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "mode=dispatch" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        if: steps.policy.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          sha="${{ steps.version.outputs.short_sha }}"
          img="${{ env.IMAGE_NAME }}"
          case "${{ steps.policy.outputs.mode }}" in
            main)
              # Always refresh :latest and publish the immutable per-commit tag.
              tags="${img}:latest,${img}:${version}-${sha}"
              # Publish :<version> only if it is not already in the registry, so a
              # released version is never overwritten by a later push to main. This
              # mirrors chart-releaser's CR_SKIP_EXISTING for the charts and keeps
              # the chart's default image tag stable for a given version.
              if docker buildx imagetools inspect "${img}:${version}" >/dev/null 2>&1; then
                echo "::notice::${img}:${version} already exists; leaving it unchanged"
              else
                tags="${img}:${version},${tags}"
              fi
              ;;
            dispatch)
              # Manual run: publish only the immutable per-commit tag.
              tags="${img}:${version}-${sha}"
              ;;
            *)
              # Pull request: build both platforms but do not publish — catches
              # arm64-incompatible changes (build tags, syscalls, CGO) before merge.
              tags="${img}:pr-${sha}"
              ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${tags}"

      - name: Build and (conditionally) push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: operator
          push: ${{ steps.policy.outputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=openfga-operator
            org.opencontainers.image.description=OpenFGA Kubernetes operator for migration orchestration
