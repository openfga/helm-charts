name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email contact@openfga.dev

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}

      - name: Export GPG key to legacy format
        run: gpg --export-secret-keys > ~/.gnupg/pubring.gpg

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Add Helm Repositories
        run: |
          helm repo add bitnami-legacy https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami
          helm repo add openfga https://openfga.github.io/helm-charts
          helm repo update

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          install_only: true

      # Packaging runs outside chart-releaser-action so charts reach GHCR before
      # their GitHub releases are published. Change detection mirrors the action's.
      - name: Package changed charts
        run: |
          set -euo pipefail
          latest_tag=$(git describe --tags --abbrev=0 HEAD~ 2>/dev/null || git rev-list --max-parents=0 --first-parent HEAD)
          mkdir -p .cr-release-packages
          git diff --find-renames --name-only "$latest_tag" -- charts |
            cut -d / -f 1-2 | sort -u |
            while IFS= read -r chart; do
              if [[ -f "$chart/Chart.yaml" ]]; then
                cr package "$chart" --config .github/cr.yaml
              fi
            done

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        if: ${{ hashFiles('.cr-release-packages/*.tgz') != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            helm push "${pkg}" "oci://ghcr.io/${{ github.repository_owner }}/helm-charts"
          done

      - name: Publish GitHub releases and Helm index
        if: ${{ hashFiles('.cr-release-packages/*.tgz') != '' }}
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          config: .github/cr.yaml
          skip_packaging: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: true
