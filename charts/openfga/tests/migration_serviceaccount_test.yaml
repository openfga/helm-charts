suite: migration serviceaccount - hook-managed account
templates:
  - templates/serviceaccount.yaml
tests:
  - it: keeps the application ServiceAccount a regular resource for an externally provided datastore
    set:
      datastore.engine: postgres
      datastore.uriSecret: my-secret
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openfga
        documentIndex: 0
      - notExists:
          path: metadata.annotations
        documentIndex: 0

  - it: renders a hook-managed ServiceAccount for the pre-install migration Job
    set:
      datastore.engine: postgres
      datastore.uriSecret: my-secret
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openfga-migrate
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install,pre-upgrade"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation"
        documentIndex: 1

  - it: copies serviceAccount.annotations to the migration ServiceAccount without their hook keys
    set:
      datastore.engine: postgres
      datastore.uriSecret: my-secret
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/openfga
        helm.sh/hook-weight: "-99"
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/openfga
        documentIndex: 0
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/openfga
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
        documentIndex: 1

  - it: keeps the migration ServiceAccount ahead of a Job with an overridden hook weight
    set:
      datastore.engine: postgres
      datastore.uriSecret: my-secret
      migrate.annotations:
        helm.sh/hook-weight: "-20"
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-25"
        documentIndex: 1

  - it: follows the hook events and delete policy the Job is overridden with
    set:
      datastore.engine: postgres
      datastore.uriSecret: my-secret
      migrate.annotations:
        helm.sh/hook: pre-install,pre-upgrade,pre-rollback
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install,pre-upgrade,pre-rollback"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
        documentIndex: 1

  - it: renders the migration ServiceAccount when migrate.annotations opts into pre-install hooks
    set:
      datastore.engine: postgres
      migrate.annotations:
        helm.sh/hook: pre-install, pre-upgrade
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openfga-migrate
        documentIndex: 1

  - it: does not render the migration ServiceAccount for an in-release datastore (legacy post-* hooks)
    set:
      datastore.engine: postgres
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations

  - it: does not render the migration ServiceAccount when the bundled subchart is enabled
    set:
      datastore.engine: postgres
      datastore.uriSecret: my-secret
      postgresql.enabled: true
    asserts:
      - hasDocuments:
          count: 1

  - it: does not render the migration ServiceAccount when migrate.annotations keeps the legacy hooks
    set:
      datastore.engine: postgres
      datastore.uriSecret: my-secret
      migrate.annotations:
        helm.sh/hook: post-install,post-upgrade
    asserts:
      - hasDocuments:
          count: 1

  - it: does not render the migration ServiceAccount when migrations run as an init container
    set:
      datastore.engine: postgres
      datastore.migrationType: initContainer
      datastore.uriSecret: my-secret
    asserts:
      - hasDocuments:
          count: 1

  - it: does not render the migration ServiceAccount when the operator runs migrations
    set:
      openfga-operator.enabled: true
      datastore.engine: postgres
      datastore.uriSecret: my-secret
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations

  - it: renders no ServiceAccount when the chart does not create one
    set:
      datastore.engine: postgres
      datastore.uriSecret: my-secret
      serviceAccount.create: false
      serviceAccount.name: existing-account
    asserts:
      - hasDocuments:
          count: 0
