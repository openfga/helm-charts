suite: migration serviceaccount lifecycle
templates:
  - templates/serviceaccount.yaml
tests:
  - it: keeps the workload account managed normally and creates a dedicated pre-hook account
    set:
      datastore.engine: postgres
      datastore.migrationType: job
      datastore.uriSecret: my-secret
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openfga
        documentIndex: 0
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openfga-migration
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install,pre-upgrade"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
        documentIndex: 1

  - it: copies workload identity annotations without allowing them to replace hook lifecycle
    set:
      datastore.engine: postgres
      datastore.migrationType: job
      datastore.uriSecret: my-secret
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/openfga
        helm.sh/hook: post-install
        helm.sh/hook-delete-policy: before-hook-creation
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/openfga
        documentIndex: 0
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/openfga
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install,pre-upgrade"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
        documentIndex: 1

  - it: follows migration Job hook overrides while remaining ordered first
    set:
      datastore.engine: postgres
      datastore.migrationType: job
      datastore.uriSecret: my-secret
      migrate.annotations:
        helm.sh/hook: pre-install
        helm.sh/hook-weight: "-3"
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-8"
        documentIndex: 1
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation,hook-succeeded"
        documentIndex: 1

  - it: creates the pre-hook account even when the workload account is externally managed
    set:
      datastore.engine: postgres
      datastore.migrationType: job
      datastore.uriSecret: my-secret
      serviceAccount.create: false
      serviceAccount.name: external-workload
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openfga-migration
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install,pre-upgrade"

  - it: renders only the normal workload account for an in-release datastore
    set:
      datastore.engine: postgres
      datastore.migrationType: job
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: renders only the normal workload account when the bundled subchart is enabled
    set:
      datastore.engine: postgres
      datastore.migrationType: job
      datastore.uriSecret: my-secret
      postgresql.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: renders only the normal workload account when migrations run as an init container
    set:
      datastore.engine: postgres
      datastore.migrationType: initContainer
      datastore.uriSecret: my-secret
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
