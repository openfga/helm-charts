{{- if .Values.http.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "openfga.fullname" . }}-test-connection"
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 8 }}
  {{- end }}
  containers:
    - name: health-check
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /openfga
        - healthcheck
        - --target
        - http
        - --http-addr
        - "{{ include "openfga.fullname" . }}:{{ (split ":" .Values.http.addr)._1 }}"
        {{- if .Values.http.tls.enabled }}
        - --http-tls-enabled
        - --http-tls-cert
        - "{{ .Values.http.tls.cert }}"
        {{- end }}
      {{- with .Values.testContainerSpec }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
  restartPolicy: Never
  {{- with .Values.testPodSpec }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
