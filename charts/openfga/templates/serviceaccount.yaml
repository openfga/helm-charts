{{- if .Values.serviceAccount.create -}}
{{- $annotations := .Values.serviceAccount.annotations | default dict -}}
{{- if eq (include "openfga.migrate.usePreInstallHooks" .) "true" -}}
{{/*
Pre-install migration hook needs its ServiceAccount to exist first, or the Job's pod is rejected
("error looking up service account"). Default weight -10 orders it before the Job hook (-5).
Helm applies hook-succeeded cleanup only after all hooks for the event complete, so the account
remains available to the Job and does not persist after a successful install or upgrade.
serviceAccount.annotations override these defaults.
*/}}
{{- $annotations = mergeOverwrite (dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded") $annotations -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openfga.serviceAccountName" . }}
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.operator.enabled .Values.migration.enabled .Values.migration.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openfga.migrationServiceAccountName" . }}
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
  {{- with .Values.migration.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
