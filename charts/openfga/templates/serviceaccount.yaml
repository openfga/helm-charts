{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openfga.serviceAccountName" . }}
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if eq (include "openfga.migrate.usePreInstallHooks" .) "true" }}
{{- if .Values.serviceAccount.create }}
---
{{- end }}
{{/*
The pre-install migration Job cannot use the workload ServiceAccount because normal resources do
not exist during pre-install. This hook-managed account is ordered before the Job and removed only
after all hooks for the event succeed. Workload identity annotations are inherited, while the
hook lifecycle remains controlled by the chart and follows any migration Job hook overrides.
*/}}
{{- $jobHooks := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-5" -}}
{{- $jobAnnotations := mergeOverwrite $jobHooks (.Values.migrate.annotations | default dict) -}}
{{- $jobHookWeight := get $jobAnnotations "helm.sh/hook-weight" | toString -}}
{{- if not (regexMatch "^[+-]?[0-9]+$" $jobHookWeight) -}}
{{- fail "migrate.annotations[helm.sh/hook-weight] must be an integer string" -}}
{{- end -}}
{{- $annotations := deepCopy (.Values.serviceAccount.annotations | default dict) -}}
{{- $annotations = mergeOverwrite $annotations (dict "helm.sh/hook" (get $jobAnnotations "helm.sh/hook") "helm.sh/hook-weight" (sub (int $jobHookWeight) 5 | toString) "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openfga.migrationServiceAccountName" . }}
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
{{- end }}
