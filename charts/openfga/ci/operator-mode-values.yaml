# Installs the openfga-operator subchart next to OpenFGA through chart-testing:
# subchart resolution, operator RBAC and the operator pod starting up. The
# memory datastore needs no migration, so the Deployment is not opted in to
# operator migrations; the Postgres migration path is covered by the operator
# E2E step in .github/workflows/test.yml.
operator:
  enabled: true

migration:
  enabled: true

datastore:
  engine: memory

openfga-operator:
  image:
    pullPolicy: Never
