suite: operator watch namespace Role
templates:
  - templates/role.yaml
tests:
  - it: should create managed-resource RBAC in the watch namespace
    release:
      namespace: operator-system
    set:
      watchNamespace: openfga-app
    asserts:
      - equal:
          path: metadata.namespace
          value: openfga-app
      - contains:
          path: rules
          content:
            apiGroups:
              - batch
            resources:
              - jobs
            verbs:
              - get
              - list
              - watch
              - create
              - delete
              - patch
